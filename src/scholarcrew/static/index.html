<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScholarCrew</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --card:#fff; --line:#e7e5e4; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0c0a09; --fg:#f5f5f4; --muted:#a8a29e; --card:#1c1917; --line:#292524; --accent:#818cf8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { margin:0 0 4px; font-size:28px; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  form { display:flex; gap:8px; }
  input { flex:1; padding:12px; font:inherit; color:inherit; background:var(--card);
          border:1px solid var(--line); border-radius:8px; }
  button { padding:12px 18px; font:inherit; font-weight:600; color:#fff; background:var(--accent);
           border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #steps { list-style:none; padding:0; margin:20px 0; }
  #steps li { padding:6px 12px; margin-bottom:6px; background:var(--card); border:1px solid var(--line);
              border-radius:8px; font-size:14px; color:var(--muted); }
  #report { white-space:pre-wrap; background:var(--card); border:1px solid var(--line);
            border-radius:8px; padding:20px; display:none; }
  #error { color:#dc2626; margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>ScholarCrew</h1>
  <p class="sub">A supervisor coordinates researcher, analyst and writer agents to answer your question with citations.</p>
  <form id="form">
    <input id="q" maxlength="300" placeholder="e.g. How do researchers reduce hallucination in RAG?" required>
    <button id="go">Research</button>
  </form>
  <ul id="steps"></ul>
  <div id="error"></div>
  <div id="report"></div>
</main>
<script>
const form = document.getElementById("form"), steps = document.getElementById("steps"),
      report = document.getElementById("report"), errorBox = document.getElementById("error"),
      go = document.getElementById("go");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  steps.textContent = ""; errorBox.textContent = ""; report.style.display = "none";
  go.disabled = true;
  try {
    const res = await fetch("/api/research?q=" + encodeURIComponent(document.getElementById("q").value));
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n"); buffer = lines.pop();
      for (const line of lines.filter(Boolean)) handle(JSON.parse(line));
    }
  } catch (err) {
    errorBox.textContent = err.message;
  } finally {
    go.disabled = false;
  }
});

function handle(msg) {
  if (msg.error) { errorBox.textContent = msg.error; return; }
  for (const text of msg.log || []) {
    const li = document.createElement("li");
    li.textContent = text;          // textContent, never innerHTML: model output is untrusted
    steps.appendChild(li);
  }
  if (msg.report) { report.textContent = msg.report; report.style.display = "block"; }
}
</script>
</body>
</html>
