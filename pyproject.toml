[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarcrew"
version = "0.1.0"
description = "A multi-agent research assistant: a supervisor coordinates researcher, analyst and writer agents to produce cited reports from arXiv and the web."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "httpx>=0.27",
    "ddgs>=9.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
dev = ["pytest>=8", "ruff>=0.5", "streamlit>=1.40"]

[project.scripts]
scholarcrew = "scholarcrew.cli:main"
scholarcrew-eval = "scholarcrew.evaluation.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scholarcrew.evaluation" = ["questions.json"]
"scholarcrew.finetune" = ["train_questions.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
