name: Deploy to Hugging Face Space

# Runs only when you have configured the secrets below; otherwise it skips quietly.
#   GitHub repo secret:   HF_TOKEN   (a Hugging Face token with write access)
#   GitHub repo variable: HF_SPACE   (e.g. your-username/scholarcrew)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN / HF_SPACE not set, skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - name: Push to the Space
        if: steps.cfg.outputs.ready == 'true'
        run: |
          # A Space reads its settings from YAML at the top of README.md. Keep that out of the
          # GitHub README by adding it only to the copy we push.
          {
            printf -- '---\ntitle: ScholarCrew\nemoji: 🔎\ncolorFrom: indigo\ncolorTo: blue\nsdk: docker\napp_port: 7860\npinned: false\n---\n\n'
            cat README.md
          } > README.space.md
          mv README.space.md README.md
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}" --allow-empty
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
